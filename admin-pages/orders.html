<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/site/css/admin.css" />
    <title>Заказы — Сибирские Деликатесы</title>
  </head>
  <body class="admin-page" data-admin-app data-admin-page="orders">
    <div class="admin-layout">
      <aside class="admin-sidebar" data-admin-sidebar>
        <a class="admin-brand" href="/admin/">
          <span class="admin-brand__mark" aria-hidden="true">▲</span>
          <span><strong>Сибирские</strong><strong>Деликатесы</strong></span>
        </a>
        <nav class="admin-nav" aria-label="Административная навигация">
          <a class="admin-nav__link" href="/admin/" data-admin-nav="dashboard"><span>Обзор</span></a>
          <a class="admin-nav__link" href="/admin/orders" data-admin-nav="orders"><span>Заказы</span><span class="admin-nav__badge" data-admin-new-orders hidden></span></a>
          <a class="admin-nav__link" href="/admin/products" data-admin-nav="products"><span>Товары</span></a>
          <a class="admin-nav__link" href="/admin/categories" data-admin-nav="categories"><span>Категории</span></a>
          <a class="admin-nav__link" href="/admin/warehouse" data-admin-nav="warehouse"><span>Склад</span></a>
          <a class="admin-nav__link" href="/admin/customers" data-admin-nav="customers"><span>Клиенты</span></a>
          <a class="admin-nav__link" href="/admin/promotions" data-admin-nav="promotions"><span>Акции</span></a>
          <a class="admin-nav__link" href="/admin/reviews" data-admin-nav="reviews"><span>Отзывы</span></a>
          <a class="admin-nav__link" href="/admin/subscriptions" data-admin-nav="subscriptions"><span>Подписки</span></a>
        </nav>
        <div class="admin-sidebar__roadmap"><span>Следующий этап</span><strong>Отзывы · Подписки · Доставка</strong></div>
        <div class="admin-sidebar__user">
          <span class="admin-sidebar__role" data-admin-user-role>...</span>
          <strong data-admin-user-name>Загрузка...</strong>
          <span data-admin-user-email></span>
          <button class="admin-link-button" type="button" data-admin-logout>Выйти</button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <p class="admin-eyebrow">CRM · Orders</p>
            <h1>Заказы</h1>
            <p class="admin-header__lead">Поиск, контроль статусов и переход в карточку заказа.</p>
          </div>
        </header>

        <section class="admin-panel">
          <form class="admin-toolbar" data-orders-filter>
            <label class="admin-search">
              <span class="sr-only">Поиск заказов</span>
              <input type="search" name="q" placeholder="Номер, клиент, телефон или email" maxlength="120" autocomplete="off" />
            </label>
            <label class="admin-select-wrap">
              <span class="sr-only">Статус заказа</span>
              <select name="status">
                <option value="">Все статусы</option>
                <option value="NEW">Новый</option>
                <option value="CONFIRMED">Подтверждён</option>
                <option value="ASSEMBLING">Собирается</option>
                <option value="READY">Готов</option>
                <option value="DELIVERING">Доставляется</option>
                <option value="COMPLETED">Выполнен</option>
                <option value="CANCELLED">Отменён</option>
              </select>
            </label>
            <button class="admin-button" type="submit">Применить</button>
            <button class="admin-button admin-button--secondary" type="button" data-orders-reset>Сбросить</button>
          </form>

          <div class="admin-table-wrap">
            <table class="admin-table admin-table--orders">
              <thead>
                <tr>
                  <th>Заказ</th>
                  <th>Клиент</th>
                  <th>Получение</th>
                  <th>Статус</th>
                  <th>Резерв</th>
                  <th>Сумма</th>
                  <th>Дата</th>
                </tr>
              </thead>
              <tbody data-orders-list>
                <tr><td colspan="7" class="admin-table__empty">Загружаем заказы...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="admin-pagination" data-orders-pagination></div>
        </section>
        <div class="admin-toast" role="status" aria-live="polite" data-admin-toast hidden></div>
      </main>
    </div>
    <script src="/site/js/admin.js" defer></script>
  </body>
</html>
